<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>همچنان برای چشات ❤️</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070711;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.text{
  position:fixed;
  top:7%;
  left:0;
  width:100%;
  text-align:center;

  color:white;

  font-family:
    Tahoma,
    Arial,
    sans-serif;

  font-size:
    clamp(22px,5vw,40px);

  text-shadow:
    0 0 8px #ff4d88,
    0 0 18px #ff174f,
    0 0 35px #ff174f;

  animation:pulse 2.5s infinite;

  z-index:10;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.06);
  }

}

</style>
</head>

<body>

<div class="text">
  همچنان برای چشات ❤️
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W;
let H;

function resize(){

  W = canvas.width =
    window.innerWidth;

  H = canvas.height =
    window.innerHeight;

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================
   مسیر ریاضی قلب
========================= */

function heart(t){

  const x =
    16 * Math.pow(
      Math.sin(t),
      3
    );

  const y =
    13 * Math.cos(t)
    - 5 * Math.cos(2*t)
    - 2 * Math.cos(3*t)
    - Math.cos(4*t);

  return {
    x:x,
    y:-y
  };

}


/* =========================
   تبدیل مسیر به صفحه
========================= */

function getPoint(
  t,
  scale
){

  const p =
    heart(t);

  return {

    x:
      W / 2 +
      p.x * scale,

    y:
      H / 2 +
      p.y * scale

  };

}


/* =========================
   ستاره‌های پس‌زمینه
========================= */

const stars=[];

for(
  let i=0;
  i<120;
  i++
){

  stars.push({

    x:
      Math.random() *
      window.innerWidth,

    y:
      Math.random() *
      window.innerHeight,

    size:
      Math.random()*2+0.3,

    phase:
      Math.random() *
      Math.PI*2

  });

}


/* =========================
   قلب‌های کوچک شناور
========================= */

const floatingHearts=[];

for(
  let i=0;
  i<25;
  i++
){

  floatingHearts.push({

    x:
      Math.random()*window.innerWidth,

    y:
      Math.random()*window.innerHeight,

    size:
      4+
      Math.random()*10,

    speed:
      .15+
      Math.random()*.45,

    phase:
      Math.random()*6

  });

}


/* =========================
   پس‌زمینه
========================= */

function drawBackground(){

  const gradient =
    ctx.createRadialGradient(

      W/2,
      H*.45,
      10,

      W/2,
      H*.45,
      Math.max(W,H)*.75

    );


  gradient.addColorStop(
    0,
    "#35152f"
  );

  gradient.addColorStop(
    .4,
    "#171025"
  );

  gradient.addColorStop(
    1,
    "#05050b"
  );


  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* ستاره‌ها */

  stars.forEach(
    star=>{

      star.phase += .015;

      const alpha =
        .25 +
        Math.sin(
          star.phase
        )*.2;


      ctx.beginPath();

      ctx.arc(
        star.x,
        star.y,
        star.size,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        `rgba(255,130,190,${alpha})`;

      ctx.fill();

    }
  );

}


/* =========================
   رسم قلب‌های کوچک
========================= */

function drawSmallHeart(
  x,
  y,
  size
){

  ctx.save();

  ctx.translate(
    x,
    y
  );


  ctx.beginPath();

  ctx.moveTo(
    0,
    size*.4
  );


  ctx.bezierCurveTo(

    -size,
    -size*.25,

    -size*.7,
    -size,

    0,
    -size*.4

  );


  ctx.bezierCurveTo(

    size*.7,
    -size,

    size,
    -size*.25,

    0,
    size*.4

  );


  ctx.fillStyle =
    "rgba(255,70,140,.22)";

  ctx.shadowBlur=10;

  ctx.shadowColor=
    "#ff267d";

  ctx.fill();

  ctx.restore();

}


function drawFloatingHearts(){

  floatingHearts.forEach(
    h=>{

      h.y -= h.speed;

      h.phase += .02;


      if(h.y < -30){

        h.y =
          H+30;

        h.x =
          Math.random()*W;

      }


      drawSmallHeart(
        h.x +
        Math.sin(h.phase)*3,

        h.y,

        h.size
      );

    }
  );

}


/* =========================
   رسم یک رشته از قلب
========================= */

function drawStrand({

  color,
  offset,
  progress,
  scale

}){

  const total=700;

  const points =
    Math.floor(
      total * progress
    );


  if(points < 2)
    return;


  ctx.beginPath();


  for(
    let i=0;
    i<=points;
    i++
  ){

    const t =

      -Math.PI +

      (i/total) *
      Math.PI*2;


    const p =
      getPoint(
        t + offset,
        scale
      );


    if(i===0){

      ctx.moveTo(
        p.x,
        p.y
      );

    }else{

      ctx.lineTo(
        p.x,
        p.y
      );

    }

  }


  ctx.lineWidth =
    Math.max(
      6,
      scale*.75
    );


  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  /* درخشش */

  ctx.shadowBlur =
    18;

  ctx.shadowColor =
    color;


  ctx.strokeStyle =
    color;


  ctx.stroke();


  ctx.shadowBlur=0;


  /* نوک نورانی که قلب را می‌کشد */

  const endT =

    -Math.PI +

    (points/total) *
    Math.PI*2;


  const end =
    getPoint(
      endT+offset,
      scale
    );


  ctx.beginPath();

  ctx.arc(
    end.x,
    end.y,
    4,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    "#ffffff";

  ctx.shadowBlur =
    25;

  ctx.shadowColor =
    color;

  ctx.fill();

  ctx.shadowBlur=0;

}


/* =========================
   زمان شروع
========================= */

const startTime =
  performance.now();


/*
   مدت تشکیل قلب:

   12 ثانیه
*/

const DRAW_TIME =
  12000;


/* =========================
   انیمیشن اصلی
========================= */

function animate(now){

  drawBackground();

  drawFloatingHearts();


  /* زمان سپری شده */

  const elapsed =
    now - startTime;


  /*
    progress از صفر
    تا یک
  */

  let progress =
    Math.min(
      elapsed / DRAW_TIME,
      1
    );


  /*
    حرکت نرم‌تر
  */

  progress =
    progress *
    progress *
    (3 - 2*progress);


  /*
    اندازه قلب
  */

  const scale =
    Math.min(
      W,
      H
    ) / 42;


  /* =====================
     رشته قرمز
  ===================== */

  drawStrand({

    color:"#e90035",

    offset:0,

    progress:

      progress,

    scale:scale

  });


  /* =====================
     رشته آبی
  ===================== */

  drawStrand({

    color:"#0757e8",

    offset:
      Math.PI/70,

    progress:

      Math.max(
        0,
        progress-.025
      ),

    scale:scale

  });


  /*
    وقتی کامل شد،
    درخشش نهایی
  */

  if(progress>=1){

    const glow =
      .45 +
      Math.sin(
        now/500
      )*.18;


    ctx.save();

    ctx.globalAlpha =
      glow;


    ctx.beginPath();


    for(
      let i=0;
      i<=700;
      i++
    ){

      const t =

        -Math.PI +

        (i/700) *
        Math.PI*2;


      const p =
        getPoint(
          t,
          scale
        );


      if(i===0){

        ctx.moveTo(
          p.x,
          p.y
        );

      }else{

        ctx.lineTo(
          p.x,
          p.y
        );

      }

    }


    ctx.closePath();


    ctx.strokeStyle =
      "rgba(255,70,160,.3)";

    ctx.lineWidth=5;

    ctx.shadowBlur=35;

    ctx.shadowColor=
      "#ff287d";


    ctx.stroke();

    ctx.restore();

  }


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);

</script>

</body>
</html>
