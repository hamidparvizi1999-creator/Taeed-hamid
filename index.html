<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artwork</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .art-container {
      max-width: 900px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .art-container img {
      max-width: 100%;
      max-height: 92vh;
      width: auto;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <main class="art-container">
    <img src="digital-art-cabin.png" alt="Digital Art" />
  </main>

</body>
</html>
