<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>همچنان برای چشات ❤️</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 45%,
            #35162f 0%,
            #170d23 45%,
            #05050b 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Tahoma,Arial,sans-serif;
}

/* متن */

.message{
    position:fixed;
    top:7%;
    width:100%;
    text-align:center;
    z-index:20;

    color:white;
    font-size:clamp(23px,5vw,40px);

    text-shadow:
        0 0 8px #ff668f,
        0 0 20px #ff2865,
        0 0 35px #ff174f;

    animation:textGlow 2.5s infinite;
}

@keyframes textGlow{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }
}


/* ستاره‌ها */

.stars{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:#ffb5d0;
    border-radius:50%;
    box-shadow:0 0 10px #ff6c9b;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.2;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1.4);
    }
}


/* صحنه گل */

.scene{
    position:relative;
    width:100%;
    height:100%;
}


/* ساقه */

.stem{
    position:absolute;

    left:50%;
    top:47%;

    width:11px;
    height:0;

    transform:
        translateX(-50%)
        rotate(1deg);

    transform-origin:top;

    background:
        linear-gradient(
            90deg,
            #174b28,
            #55a447,
            #174b28
        );

    border-radius:20px;

    box-shadow:
        0 0 10px #3d8c42;

    animation:growStem 7s ease-out forwards;
}

@keyframes growStem{

    0%{
        height:0;
    }

    100%{
        height:43vh;
    }
}


/* برگ */

.leaf{
    position:absolute;

    left:50%;
    top:67%;

    width:130px;
    height:48px;

    background:
        linear-gradient(
            135deg,
            #438c3c,
            #173c24
        );

    border-radius:
        100% 0 100% 0;

    transform-origin:left center;

    opacity:0;

    animation:
        leafAppear 3s 5s forwards;
}

.leaf.left{
    transform:
        translateX(-5px)
        rotate(-28deg);
}

.leaf.right{
    top:74%;

    transform:
        translateX(-115px)
        rotate(28deg)
        scaleX(-1);

    animation-delay:6s;
}

@keyframes leafAppear{

    from{
        opacity:0;
        transform:
            translateX(-5px)
            rotate(-28deg)
            scale(.2);
    }

    to{
        opacity:1;
        transform:
            translateX(-5px)
            rotate(-28deg)
            scale(1);
    }
}


/* گل */

.flower{
    position:absolute;

    left:50%;
    top:35%;

    width:300px;
    height:300px;

    transform:
        translate(-50%,-50%);

}


/* گلبرگ‌ها */

.petal{
    position:absolute;

    left:50%;
    top:50%;

    width:105px;
    height:205px;

    transform-origin:
        50% 100%;

    border-radius:
        70% 70% 35% 35%;

    opacity:0;

    background:
        radial-gradient(
            ellipse at 50% 75%,
            #fff8fb 0%,
            #ffd7e6 30%,
            #ff8fb4 72%,
            #e83d70 100%
        );

    box-shadow:
        inset 0 -10px 20px rgba(170,20,70,.18),
        0 0 15px rgba(255,80,140,.25);

    transform:
        translate(-50%,-100%)
        rotate(var(--angle))
        scaleY(.05);

    animation:
        bloom 5s var(--delay) cubic-bezier(.2,.8,.2,1)
        forwards;
}


/*
 خطوط طبیعی روی گلبرگ
*/

.petal::after{

    content:"";

    position:absolute;

    left:50%;
    top:15px;

    width:3px;
    height:170px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            rgba(180,30,80,0),
            rgba(190,30,80,.25),
            rgba(180,30,80,0)
        );

    border-radius:50%;
}


/* شکوفا شدن */

@keyframes bloom{

    0%{
        opacity:0;
        transform:
            translate(-50%,-100%)
            rotate(var(--angle))
            scaleY(.05)
            scaleX(.35);
    }

    45%{
        opacity:1;
        transform:
            translate(-50%,-100%)
            rotate(var(--angle))
            scaleY(.7)
            scaleX(.8);
    }

    100%{
        opacity:1;
        transform:
            translate(-50%,-100%)
            rotate(var(--angle))
            scaleY(1)
            scaleX(1);
    }
}


/* مرکز گل */

.center{
    position:absolute;

    left:50%;
    top:50%;

    width:55px;
    height:55px;

    transform:
        translate(-50%,-50%)
        scale(0);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff7a8 0%,
            #ffd83d 35%,
            #e99b18 70%,
            #8f4b0c 100%
        );

    box-shadow:
        0 0 20px #ffd83d;

    z-index:10;

    animation:
        centerAppear 3s 9s forwards;
}

@keyframes centerAppear{

    0%{
        transform:
            translate(-50%,-50%)
            scale(0);
    }

    70%{
        transform:
            translate(-50%,-50%)
            scale(1.25);
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* پرچم‌ها / پرچمک‌های لیلیوم */

.stamen{
    position:absolute;

    left:50%;
    top:50%;

    width:4px;
    height:95px;

    background:
        linear-gradient(
            to bottom,
            #efc34a,
            #8c5218
        );

    transform-origin:50% 100%;

    opacity:0;

    z-index:11;

    animation:
        stamens 3s 9.5s forwards;
}

.stamen::after{

    content:"";

    position:absolute;

    top:-7px;
    left:-4px;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#8e4a20;

    box-shadow:
        0 0 8px #ff9d3d;
}

@keyframes stamens{

    from{
        opacity:0;
        transform:
            translate(-50%,-100%)
            rotate(var(--a))
            scaleY(0);
    }

    to{
        opacity:1;
        transform:
            translate(-50%,-100%)
            rotate(var(--a))
            scaleY(1);
    }
}


/* گرده‌های نورانی */

.pollen{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ffd84a;

    box-shadow:
        0 0 12px #ffd84a;

    opacity:0;

    animation:
        pollenFloat 5s 10s infinite;
}

@keyframes pollenFloat{

    0%{
        opacity:0;
        transform:translateY(0) scale(.5);
    }

    20%{
        opacity:.8;
    }

    100%{
        opacity:0;
        transform:
            translateY(-90px)
            translateX(20px)
            scale(1.2);
    }
}


/* درخشش نهایی */

.glow{
    position:absolute;

    left:50%;
    top:35%;

    width:280px;
    height:280px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,80,140,.22),
            transparent 68%
        );

    opacity:0;

    animation:
        finalGlow 4s 11s infinite;
}

@keyframes finalGlow{

    0%,100%{
        opacity:.35;
        transform:
            translate(-50%,-50%)
            scale(.9);
    }

    50%{
        opacity:.7;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="message">
    همچنان برای چشات ❤️
</div>

<div class="scene">

    <div class="glow"></div>

    <div class="stem"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="flower">

        <!-- گلبرگ‌های لیلیوم -->

        <div class="petal"
             style="--angle:0deg;--delay:1s;"></div>

        <div class="petal"
             style="--angle:60deg;--delay:2s;"></div>

        <div class="petal"
             style="--angle:120deg;--delay:3s;"></div>

        <div class="petal"
             style="--angle:180deg;--delay:4s;"></div>

        <div class="petal"
             style="--angle:240deg;--delay:5s;"></div>

        <div class="petal"
             style="--angle:300deg;--delay:6s;"></div>


        <!-- پرچم‌ها -->

        <div class="stamen"
             style="--a:0deg;"></div>

        <div class="stamen"
             style="--a:45deg;"></div>

        <div class="stamen"
             style="--a:90deg;"></div>

        <div class="stamen"
             style="--a:135deg;"></div>

        <div class="stamen"
             style="--a:180deg;"></div>

        <div class="stamen"
             style="--a:225deg;"></div>

        <div class="stamen"
             style="--a:270deg;"></div>

        <div class="stamen"
             style="--a:315deg;"></div>


        <div class="center"></div>

    </div>

</div>


<script>

/* ستاره‌ها */

const stars=
document.getElementById("stars");

for(let i=0;i<90;i++){

    const star=
    document.createElement("div");

    star.className="star";

    star.style.left=
        Math.random()*100+"%";

    star.style.top=
        Math.random()*100+"%";

    star.style.animationDelay=
        Math.random()*3+"s";

    star.style.opacity=
        Math.random();

    stars.appendChild(star);
}


/* گرده‌های نورانی */

for(let i=0;i<18;i++){

    const pollen=
    document.createElement("div");

    pollen.className="pollen";

    pollen.style.left=
        (45+Math.random()*10)+"%";

    pollen.style.top=
        (30+Math.random()*15)+"%";

    pollen.style.animationDelay=
        (10+Math.random()*5)+"s";

    document.querySelector(".scene")
        .appendChild(pollen);
}

</script>

</body>
</html>
