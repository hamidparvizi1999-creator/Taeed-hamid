<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>همچنان برای چشات ❤️</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070611;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.message{
  position:fixed;
  z-index:20;
  top:7%;
  width:100%;
  text-align:center;

  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  font-size:clamp(22px,5vw,40px);

  text-shadow:
    0 0 8px #ff477d,
    0 0 18px #ff174f,
    0 0 35px #ff174f;

  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.06);
  }
}
</style>
</head>

<body>

<div class="message">
  همچنان برای چشات ❤️
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W,H;

function resize(){

  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =================================================
   قلب اصلی
================================================= */

function heart(t){

  const x =
    16 * Math.pow(Math.sin(t),3);

  const y =
    13*Math.cos(t)
    -5*Math.cos(2*t)
    -2*Math.cos(3*t)
    -Math.cos(4*t);

  return {
    x:x,
    y:-y
  };
}


/* =================================================
   نقطه روی قلب
================================================= */

function getPoint(t,scale){

  const p=heart(t);

  return {
    x:W/2+p.x*scale,
    y:H/2+p.y*scale
  };

}


/* =================================================
   پس زمینه
================================================= */

const stars=[];

for(let i=0;i<120;i++){

  stars.push({

    x:Math.random()*W,
    y:Math.random()*H,

    r:
      .4+
      Math.random()*1.7,

    phase:
      Math.random()*Math.PI*2

  });

}


const littleHearts=[];

for(let i=0;i<30;i++){

  littleHearts.push({

    x:Math.random()*W,
    y:Math.random()*H,

    size:
      4+
      Math.random()*10,

    speed:
      .15+
      Math.random()*.45,

    phase:
      Math.random()*10

  });

}


function drawBackground(){

  const gradient=
    ctx.createRadialGradient(
      W/2,
      H*.45,
      10,
      W/2,
      H*.45,
      Math.max(W,H)*.8
    );

  gradient.addColorStop(
    0,
    "#3b1737"
  );

  gradient.addColorStop(
    .45,
    "#191027"
  );

  gradient.addColorStop(
    1,
    "#05050b"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  stars.forEach(s=>{

    s.phase+=.015;

    const alpha=
      .25+
      Math.sin(s.phase)*.22;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,145,195,${alpha})`;

    ctx.fill();

  });

}


/* =================================================
   قلب‌های شناور
================================================= */

function drawSmallHeart(x,y,size){

  ctx.save();

  ctx.translate(x,y);

  ctx.beginPath();

  ctx.moveTo(
    0,
    size*.4
  );

  ctx.bezierCurveTo(
    -size,
    -size*.3,
    -size*.7,
    -size,
    0,
    -size*.4
  );

  ctx.bezierCurveTo(
    size*.7,
    -size,
    size,
    -size*.3,
    0,
    size*.4
  );

  ctx.fillStyle=
    "rgba(255,65,135,.20)";

  ctx.shadowBlur=12;

  ctx.shadowColor="#ff277d";

  ctx.fill();

  ctx.restore();

}


function drawLittleHearts(){

  littleHearts.forEach(h=>{

    h.y-=h.speed;
    h.phase+=.02;

    if(h.y<-30){

      h.y=H+30;
      h.x=Math.random()*W;

    }

    drawSmallHeart(
      h.x+
      Math.sin(h.phase)*3,

      h.y,

      h.size
    );

  });

}


/* =================================================
   ساخت مسیرهای دو رشته
================================================= */

function createStrand(
  direction,
  scale,
  phase
){

  const points=[];

  const count=1600;

  /*
     شدت پیچش دو رشته
  */

  const weaveSize=
    Math.max(
      3.5,
      scale*.55
    );

  /*
     تعداد بافت‌ها
  */

  const weaveCount=15;


  for(let i=0;i<=count;i++){

    let u=i/count;

    /*
      جهت حرکت:
      قرمز از پایین به راست
      آبی از پایین به چپ
    */

    let t;

    if(direction===1){

      t=
        -Math.PI+
        u*Math.PI*2;

    }else{

      t=
        Math.PI-
        u*Math.PI*2;

    }


    /*
      موجی که باعث می‌شود
      دو رشته دور هم بپیچند
    */

    const wave=
      Math.sin(
        u*Math.PI*2*weaveCount+
        phase
      );


    /*
      برای به دست آوردن عمود
      مسیر قلب
    */

    const p1=
      getPoint(t,scale);

    const p2=
      getPoint(t+.002,scale);


    let dx=
      p2.x-p1.x;

    let dy=
      p2.y-p1.y;


    const length=
      Math.sqrt(
        dx*dx+
        dy*dy
      ) || 1;


    /*
      بردار عمود
    */

    const nx=
      -dy/length;

    const ny=
      dx/length;


    points.push({

      x:
        p1.x+
        nx*
        weaveSize*
        wave,

      y:
        p1.y+
        ny*
        weaveSize*
        wave,

      t:t,

      u:u,

      wave:wave

    });

  }

  return points;

}


/* =================================================
   رسم رشته
================================================= */

function drawFullStrand(
  points,
  visible,
  color,
  width
){

  const end=
    Math.floor(
      points.length*
      visible
    );

  if(end<2)
    return;


  ctx.beginPath();


  for(let i=0;i<end;i++){

    const p=points[i];

    if(i===0){

      ctx.moveTo(
        p.x,
        p.y
      );

    }else{

      ctx.lineTo(
        p.x,
        p.y
      );

    }

  }


  ctx.strokeStyle=color;

  ctx.lineWidth=width;

  ctx.lineCap="round";

  ctx.lineJoin="round";

  ctx.shadowBlur=18;

  ctx.shadowColor=color;

  ctx.stroke();

  ctx.shadowBlur=0;

}


/* =================================================
   ایجاد حالت «روی هم / زیر هم»
================================================= */

function drawIntersections(
  red,
  blue,
  visible,
  width,
  scale
){

  const count=
    Math.min(
      red.length,
      blue.length
    );


  /*
    نقاطی که رشته‌ها
    با هم می‌بافند
  */

  const weaveCount=15;


  for(let n=0;n<weaveCount;n++){

    /*
      محل برخوردها
    */

    const center =
      (n+.5)/weaveCount;


    /*
      محدوده کوچک اطراف برخورد
    */

    const range=.012;


    const rStart=
      Math.floor(
        (center-range)*
        count
      );

    const rEnd=
      Math.floor(
        (center+range)*
        count
      );


    if(rStart<0 || rStart>=count)
      continue;


    /*
      یک بار قرمز روی آبی
      و بار بعد آبی روی قرمز
    */

    const redOnTop=
      n%2===0;


    const top=
      redOnTop
      ? red
      : blue;


    const color=
      redOnTop
      ? "#ed0038"
      : "#075bea";


    /*
      فقط اگر این قسمت
      قبلاً ساخته شده باشد
    */

    if(
      center>visible
    )
      continue;


    ctx.save();

    ctx.beginPath();


    for(
      let i=rStart;
      i<=rEnd &&
      i<top.length;
      i++
    ){

      const p=top[i];

      if(i===rStart){

        ctx.moveTo(
          p.x,
          p.y
        );

      }else{

        ctx.lineTo(
          p.x,
          p.y
        );

      }

    }


    ctx.strokeStyle=color;

    ctx.lineWidth=
      width+2.5;

    ctx.lineCap="round";

    ctx.shadowBlur=20;

    ctx.shadowColor=color;

    ctx.stroke();

    ctx.restore();

  }

}


/* =================================================
   نقطه نورانی سر هر رشته
================================================= */

function drawHead(
  points,
  progress,
  color
){

  const index=
    Math.min(
      points.length-1,
      Math.floor(
        progress*
        (points.length-1)
      )
    );


  const p=
    points[index];

  if(!p)
    return;


  ctx.save();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    5,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#fff";

  ctx.shadowBlur=30;

  ctx.shadowColor=color;

  ctx.fill();

  ctx.restore();

}


/* =================================================
   شروع
================================================= */

const startTime=
performance.now();


/*
   قلب در 14 ثانیه
*/

const DRAW_TIME=
14000;


/* =================================================
   انیمیشن
================================================= */

function animate(now){

  drawBackground();

  drawLittleHearts();


  /*
     میزان پیشرفت
  */

  let progress=
    (now-startTime)/
    DRAW_TIME;


  progress=
    Math.min(
      progress,
      1
    );


  /*
     حرکت نرم
  */

  const smooth=
    progress*
    progress*
    (3-2*progress);


  /*
     اندازه قلب
  */

  const scale=
    Math.min(W,H)/42;


  /*
     دو رشته مستقل
  */

  const red=
    createStrand(
      1,
      scale,
      0
    );


  const blue=
    createStrand(
      -1,
      scale,
      Math.PI
    );


  const width=
    Math.max(
      7,
      scale*.78
    );


  /*
     اول رشته‌ها را
     جداگانه رسم می‌کنیم
  */

  drawFullStrand(
    red,
    smooth,
    "#ed0038",
    width
  );


  drawFullStrand(
    blue,
    smooth,
    "#075bea",
    width
  );


  /*
     حالا نقاط درهم‌تنیدگی
     را روی آن‌ها می‌کشیم
  */

  drawIntersections(
    red,
    blue,
    smooth,
    width,
    scale
  );


  /*
     سر حرکت هر دو رشته
  */

  drawHead(
    red,
    smooth,
    "#ed0038"
  );


  drawHead(
    blue,
    smooth,
    "#075bea"
  );


  /*
     بعد از کامل شدن،
     درخشش آرام
  */

  if(progress>=1){

    const glow=
      .35+
      Math.sin(now/450)*.15;


    ctx.save();

    ctx.globalAlpha=glow;

    /*
       هاله قرمز
    */

    ctx.beginPath();

    red.forEach((p,i)=>{

      if(i===0)
        ctx.moveTo(p.x,p.y);
      else
        ctx.lineTo(p.x,p.y);

    });

    ctx.strokeStyle=
      "rgba(255,30,80,.25)";

    ctx.lineWidth=4;

    ctx.shadowBlur=30;

    ctx.shadowColor="#ff174f";

    ctx.stroke();


    /*
       هاله آبی
    */

    ctx.beginPath();

    blue.forEach((p,i)=>{

      if(i===0)
        ctx.moveTo(p.x,p.y);
      else
        ctx.lineTo(p.x,p.y);

    });

    ctx.strokeStyle=
      "rgba(20,90,255,.25)";

    ctx.lineWidth=4;

    ctx.shadowBlur=30;

    ctx.shadowColor="#075bea";

    ctx.stroke();

    ctx.restore();

  }


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);

</script>

</body>
</html>
