<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>همچنان برای چشات ❤️</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080711;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.message{
  position:fixed;
  z-index:10;
  top:7%;
  width:100%;
  text-align:center;

  color:white;
  font-family:Tahoma,Arial,sans-serif;
  font-size:clamp(22px,5vw,40px);

  text-shadow:
    0 0 8px #ff4c88,
    0 0 20px #ff174f,
    0 0 35px #ff174f;

  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.06);
  }
}
</style>
</head>

<body>

<div class="message">
  همچنان برای چشات ❤️
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W,H;

function resize(){

  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =================================
   قلب ریاضی
================================= */

function heart(t){

  const x=
    16*Math.pow(Math.sin(t),3);

  const y=
    13*Math.cos(t)
    -5*Math.cos(2*t)
    -2*Math.cos(3*t)
    -Math.cos(4*t);

  return {
    x:x,
    y:-y
  };

}


/* =================================
   تبدیل به مختصات صفحه
================================= */

function getPoint(t,scale){

  const p=heart(t);

  return {

    x:W/2+p.x*scale,

    y:H/2+p.y*scale

  };

}


/* =================================
   پس زمینه
================================= */

const stars=[];

for(let i=0;i<120;i++){

  stars.push({

    x:Math.random()*W,

    y:Math.random()*H,

    r:.3+Math.random()*1.8,

    phase:Math.random()*Math.PI*2

  });

}


const floatingHearts=[];

for(let i=0;i<28;i++){

  floatingHearts.push({

    x:Math.random()*W,

    y:Math.random()*H,

    size:4+Math.random()*10,

    speed:.15+Math.random()*.45,

    phase:Math.random()*10

  });

}


function background(){

  const g=
    ctx.createRadialGradient(
      W/2,
      H*.45,
      20,
      W/2,
      H*.45,
      Math.max(W,H)*.75
    );

  g.addColorStop(
    0,
    "#35152f"
  );

  g.addColorStop(
    .45,
    "#171025"
  );

  g.addColorStop(
    1,
    "#05050b"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  stars.forEach(s=>{

    s.phase+=.015;

    const a=
      .25+
      Math.sin(s.phase)*.2;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,140,190,${a})`;

    ctx.fill();

  });

}


/* =================================
   قلب های کوچک
================================= */

function smallHeart(x,y,s){

  ctx.save();

  ctx.translate(x,y);

  ctx.beginPath();

  ctx.moveTo(
    0,
    s*.4
  );

  ctx.bezierCurveTo(
    -s,
    -s*.25,
    -s*.7,
    -s,
    0,
    -s*.4
  );

  ctx.bezierCurveTo(
    s*.7,
    -s,
    s,
    -s*.25,
    0,
    s*.4
  );

  ctx.fillStyle=
    "rgba(255,65,135,.22)";

  ctx.shadowBlur=12;

  ctx.shadowColor="#ff267d";

  ctx.fill();

  ctx.restore();

}


function drawFloatingHearts(){

  floatingHearts.forEach(h=>{

    h.y-=h.speed;

    h.phase+=.02;

    if(h.y<-30){

      h.y=H+30;

      h.x=Math.random()*W;

    }

    smallHeart(

      h.x+Math.sin(h.phase)*3,

      h.y,

      h.size

    );

  });

}


/* =================================
   ساخت نقاط قلب
================================= */

function makePoints(scale){

  const points=[];

  const count=900;

  for(let i=0;i<=count;i++){

    const t=
      -Math.PI+
      (i/count)*Math.PI*2;

    points.push(
      getPoint(t,scale)
    );

  }

  return points;

}


/* =================================
   رسم یک قسمت از رشته
================================= */

function strokeSegment(
  points,
  start,
  end,
  color,
  width
){

  if(end<=start)
    return;

  ctx.beginPath();

  for(
    let i=start;
    i<=end;
    i++
  ){

    const p=points[i];

    if(i===start){

      ctx.moveTo(
        p.x,
        p.y
      );

    }else{

      ctx.lineTo(
        p.x,
        p.y
      );

    }

  }

  ctx.strokeStyle=color;

  ctx.lineWidth=width;

  ctx.lineCap="round";

  ctx.lineJoin="round";

  ctx.stroke();

}


/* =================================
   قلب درهم تنیده
================================= */

function drawInterwovenHeart(
  progress,
  scale
){

  const points=
    makePoints(scale);

  const total=
    points.length-1;

  const visible=
    Math.floor(
      total*progress
    );

  if(visible<2)
    return;


  const red="#e60032";
  const blue="#064fe8";

  const width=
    Math.max(
      7,
      scale*.8
    );


  /*
    اول رشته آبی
  */

  ctx.save();

  ctx.shadowBlur=15;

  ctx.shadowColor=blue;

  strokeSegment(
    points,
    0,
    visible,
    blue,
    width
  );

  ctx.restore();


  /*
    حالا قسمت‌های قرمز
    روی آبی قرار می‌گیرند
  */

  const weaveLength=38;

  for(
    let start=0;
    start<visible;
    start+=weaveLength*2
  ){

    const end=
      Math.min(
        start+weaveLength,
        visible
      );

    ctx.save();

    ctx.shadowBlur=16;

    ctx.shadowColor=red;

    strokeSegment(
      points,
      start,
      end,
      red,
      width
    );

    ctx.restore();

  }


  /*
    قسمت‌های آبی دوباره
    روی قرمز قرار می‌گیرند
  */

  for(
    let start=weaveLength;
    start<visible;
    start+=weaveLength*2
  ){

    const end=
      Math.min(
        start+weaveLength,
        visible
      );

    ctx.save();

    ctx.shadowBlur=16;

    ctx.shadowColor=blue;

    strokeSegment(
      points,
      start,
      end,
      blue,
      width
    );

    ctx.restore();

  }


  /*
    یک رشته دوم قرمز
    کمی جابه‌جا برای حالت
    درهم‌تنیده واقعی‌تر
  */

  const second=[];

  for(
    let i=0;
    i<=900;
    i++
  ){

    const t=
      -Math.PI+
      (i/900)*Math.PI*2;

    /*
      کمی موج در مسیر
    */

    const p=
      getPoint(
        t+.045,
        scale
      );

    second.push(p);

  }


  const secondVisible=
    Math.floor(
      total*progress
    );


  /*
    فقط بخش‌هایی از رشته دوم
    نمایش داده می‌شود
  */

  for(
    let start=0;
    start<secondVisible;
    start+=weaveLength*2
  ){

    const end=
      Math.min(
        start+weaveLength,
        secondVisible
      );

    ctx.save();

    ctx.shadowBlur=14;

    ctx.shadowColor=red;

    strokeSegment(
      second,
      start,
      end,
      red,
      width*.72
    );

    ctx.restore();

  }


  /*
    نقطه نورانی که
    مسیر را دنبال می‌کند
  */

  const current=
    points[visible];

  if(current){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      current.x,
      current.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fillStyle="white";

    ctx.shadowBlur=28;

    ctx.shadowColor="#ff4d91";

    ctx.fill();

    ctx.restore();

  }

}


/* =================================
   زمان ساخت
================================= */

const start=
performance.now();

const DRAW_TIME=
12000;


/* =================================
   انیمیشن
================================= */

function animate(now){

  background();

  drawFloatingHearts();


  let progress=
    (now-start)/
    DRAW_TIME;


  progress=
    Math.min(
      progress,
      1
    );


  /*
    شروع آهسته و پایان نرم
  */

  const smooth=
    progress*
    progress*
    (3-2*progress);


  /*
    اندازه مناسب موبایل
  */

  const scale=
    Math.min(W,H)/42;


  drawInterwovenHeart(
    smooth,
    scale
  );


  /*
    وقتی کامل شد،
    درخشش نهایی
  */

  if(progress>=1){

    const glow=
      .45+
      Math.sin(now/450)*.18;


    ctx.save();

    ctx.globalAlpha=
      glow;


    const points=
      makePoints(scale);


    ctx.beginPath();

    points.forEach(
      (p,i)=>{

        if(i===0){

          ctx.moveTo(
            p.x,
            p.y
          );

        }else{

          ctx.lineTo(
            p.x,
            p.y
          );

        }

      }
    );


    ctx.strokeStyle=
      "rgba(255,60,150,.25)";

    ctx.lineWidth=5;

    ctx.shadowBlur=35;

    ctx.shadowColor="#ff287d";

    ctx.stroke();

    ctx.restore();

  }


  requestAnimationFrame(
    animate
  );

}

requestAnimationFrame(
  animate
);

</script>

</body>
</html>
