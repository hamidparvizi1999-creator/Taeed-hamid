<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>...</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: #f5eeee;

            overflow: hidden;

            background:
                linear-gradient(
                    rgba(8, 6, 7, 0.45),
                    rgba(8, 6, 7, 0.55)
                ),
                url("./background.jpg?v=3");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        /* لایه‌ی تاریک روی عکس */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(110, 35, 55, 0.10),
                    transparent 55%
                );

            pointer-events: none;

            z-index: 0;
        }


        /* صفحه اصلی */

        .page {
            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            position: relative;

            z-index: 2;
        }


        /* کارت سؤال */

        .question-box {

            width: min(500px, 92vw);

            padding: 42px 28px 32px;

            text-align: center;

            background:
                rgba(15, 11, 13, 0.72);

            border:

                1px solid
                rgba(255, 190, 205, 0.16);

            border-radius: 24px;

            backdrop-filter: blur(13px);

            -webkit-backdrop-filter: blur(13px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255,255,255,0.05);

            animation:
                boxAppear 1.2s ease;
        }


        @keyframes boxAppear {

            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* سؤال */

        #question {

            margin: 0 0 35px;

            font-size: clamp(22px, 5vw, 30px);

            font-weight: 400;

            line-height: 1.8;

            color: #f5e7e9;

            text-shadow:
                0 3px 20px rgba(0,0,0,0.7);
        }


        /* دکمه‌ها */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            min-height: 58px;

            position: relative;
        }


        button {

            width: 135px;

            height: 52px;

            border: none;

            border-radius: 14px;

            font-family: inherit;

            font-size: 17px;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        /* موافقم */

        #yes {

            background:
                linear-gradient(
                    135deg,
                    #9f3859,
                    #c65476
                );

            color: white;

            box-shadow:
                0 8px 25px
                rgba(170, 45, 85, 0.25);
        }


        #yes:hover {

            transform:
                translateY(-3px)
                scale(1.03);

            box-shadow:
                0 12px 32px
                rgba(200, 55, 95, 0.35);
        }


        /* نه */

        #no {

            background:
                rgba(255,255,255,0.08);

            color:
                rgba(255,255,255,0.85);

            border:
                1px solid
                rgba(255,255,255,0.10);

            position: relative;

            transition:
                left 0.15s ease,
                top 0.15s ease;
        }


        /* متن کوچک بین سوالات */

        .small-text {

            margin-top: 30px;

            font-size: 12px;

            line-height: 2;

            color:
                rgba(255, 230, 235, 0.48);

            font-weight: 300;

            transition:
                opacity 0.8s ease;

        }


        /* جمله‌ی دوم */

        #secondMessage {

            display: none;

            margin-top: 26px;

            font-size: 12px;

            line-height: 2.2;

            color:
                rgba(255, 220, 228, 0.55);

            padding: 0 15px;

            animation:
                fadeIn 1.2s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* متن پایینی */

        .secret-text {

            position: fixed;

            bottom: 10px;

            left: 0;

            right: 0;

            text-align: center;

            font-size: 8px;

            color:
                rgba(255,255,255,0.16);

            letter-spacing: 0.5px;

            user-select: none;

            pointer-events: none;

            z-index: 5;
        }


        /* پایان */

        #finalScreen {

            display: none;

            min-height: 100vh;

            width: 100%;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 25px;

            animation:
                fadeIn 1.5s ease;
        }


        .final-box {

            width: min(500px, 90vw);

            padding: 45px 25px;

            border-radius: 25px;

            background:
                rgba(12, 9, 10, 0.75);

            border:
                1px solid
                rgba(255, 180, 195, 0.12);

            backdrop-filter:
                blur(14px);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.6);
        }


        .final-text {

            font-size: 25px;

            line-height: 2;

            color: #f3dfe3;
        }


        .final-sub {

            margin-top: 20px;

            font-size: 12px;

            color:
                rgba(255,255,255,0.4);

        }


        /* موبایل */

        @media (max-width: 600px) {

            .question-box {

                padding:
                    35px 18px 28px;

            }

            #question {

                font-size: 22px;

                margin-bottom: 30px;
            }

            button {

                width: 125px;

                height: 50px;

                font-size: 16px;
            }

            .small-text {

                font-size: 11px;
            }

        }

    </style>
</head>


<body>


    <!-- صفحه سوالات -->

    <main class="page" id="mainPage">

        <section class="question-box">

            <h1 id="question">
                آیا با حمید موافقی؟
            </h1>


            <div class="buttons">

                <button id="no">
                    نه
                </button>

                <button id="yes">
                    موافقم
                </button>

            </div>


            <!-- جمله‌ای که بعداً نمایش داده می‌شود -->

            <div
                id="secondMessage"
            >
                جواب همه‌ی سوالا نمیدونم نیست...
                <br>
                گاهی فقط باید شروع کنی حرف بزنی
                از هر چی که دوست داری.
            </div>


            <!-- جمله‌ی ظریف اول -->

            <div
                class="small-text"
                id="firstMessage"
            >
                بعضی چیزا رو باید حس کردددددد...
            </div>

        </section>

    </main>



    <!-- صفحه پایانی -->

    <section
        id="finalScreen"
    >

        <div class="final-box">

            <div class="final-text">

                پس با حمید
                <br>
                راز رو تخریب کن

            </div>

            <div class="final-sub">

                بعضی حرف‌ها فقط وقتی گفته میشن،
                معنی پیدا می‌کنن...

            </div>

        </div>

    </section>



    <!-- نوشته خیلی کوچک پایین -->

    <div class="secret-text">

        حمید دو تا گوش فیلی داره

    </div>



    <script>


        const question =
            document.getElementById("question");

        const yes =
            document.getElementById("yes");

        const no =
            document.getElementById("no");

        const secondMessage =
            document.getElementById("secondMessage");

        const firstMessage =
            document.getElementById("firstMessage");

        const mainPage =
            document.getElementById("mainPage");

        const finalScreen =
            document.getElementById("finalScreen");


        let stage = 1;



        /*
         * دکمه «نه» فرار می‌کند
         */

        function escapeNo() {

            const buttonWidth =
                no.offsetWidth;

            const buttonHeight =
                no.offsetHeight;


            const maxX =
                window.innerWidth
                - buttonWidth
                - 20;


            const maxY =
                window.innerHeight
                - buttonHeight
                - 20;


            const x =
                Math.random() * maxX;


            const y =
                Math.random() * maxY;


            no.style.position = "fixed";

            no.style.left =
                Math.max(10, x) + "px";

            no.style.top =
                Math.max(10, y) + "px";

            no.style.zIndex = "9999";
        }



        /*
         * کامپیوتر
         */

        no.addEventListener(
            "mouseenter",
            escapeNo
        );



        /*
         * موبایل
         */

        no.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                escapeNo();

            },
            {
                passive: false
            }
        );



        /*
         * اگر به هر شکلی کلیک شد
         */

        no.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                escapeNo();

            }
        );



        /*
         * دکمه موافقم
         */

        yes.addEventListener(
            "click",
            function() {


                /*
                 * سوال اول
                 */

                if (stage === 1) {

                    stage = 2;


                    question.innerHTML =
                        "نظرات حمید رو قبول داری؟";


                    yes.innerHTML =
                        "موافقم";


                    no.innerHTML =
                        "نه";


                    /*
                     * نمایش جمله دوم
                     */

                    firstMessage.style.display =
                        "none";


                    secondMessage.style.display =
                        "block";


                    /*
                     * برگرداندن دکمه نه
                     */

                    no.style.position =
                        "relative";

                    no.style.left = "";

                    no.style.top = "";

                    no.style.zIndex = "";


                }


                /*
                 * سوال دوم
                 */

                else {

                    showFinal();

                }

            }
        );



        /*
         * پایان
         */

        function showFinal() {

            mainPage.style.display =
                "none";


            finalScreen.style.display =
                "flex";

        }


    </script>


</body>
</html>
