<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برای تو 🌸❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  background:radial-gradient(circle at 50% 35%,
  #32182f 0%,#130d1c 45%,#05050b 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Tahoma,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.note{
  position:fixed;
  top:7%;
  width:100%;
  text-align:center;
  color:#ffe7f2;
  font-size:clamp(18px,3vw,30px);
  text-shadow:0 0 18px #ff6fae;
  pointer-events:none;
  animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.04);
    opacity:.85;
  }
}
</style>
</head>

<body>

<div class="note"> برای چشات    ❤️</div>

<canvas id="flower"></canvas>

<script>
const canvas=document.getElementById("flower");
const ctx=canvas.getContext("2d");

let W,H,t=0;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}

addEventListener("resize",resize);
resize();


/* قلب‌های شناور */
function heart(x,y,s,a){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(a);

  ctx.beginPath();
  ctx.moveTo(0,s*.35);
  ctx.bezierCurveTo(
    -s*.9,-s*.15,
    -s*.55,-s*.8,
    0,-s*.38
  );
  ctx.bezierCurveTo(
    s*.55,-s*.8,
    s*.9,-s*.15,
    0,s*.35
  );

  ctx.fillStyle="rgba(255,120,177,.18)";
  ctx.fill();

  ctx.restore();
}


let hearts=Array.from({length:35},()=>({
  x:Math.random()*W,
  y:Math.random()*H,
  s:4+Math.random()*10,
  speed:.15+Math.random()*.5,
  a:Math.random()*6
}));


/* ساقه و برگ‌ها */
function stem(){

  let baseX=W/2;
  let baseY=H*.92;

  ctx.save();
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(baseX,baseY);

  ctx.bezierCurveTo(
    W*.49,H*.72,
    W*.54,H*.53,
    W*.5,H*.28
  );

  ctx.strokeStyle="#4d6b3d";
  ctx.lineWidth=7;
  ctx.stroke();


  const leaves=[
    [H*.63,-.45],
    [H*.55,.55],
    [H*.43,-.45]
  ];

  leaves.forEach(([y,rot])=>{

    ctx.save();

    ctx.translate(W*.5,y);
    ctx.rotate(rot);

    ctx.beginPath();
    ctx.ellipse(
      35,0,
      55,18,
      0,0,Math.PI*2
    );

    ctx.fillStyle="#688d4e";
    ctx.fill();

    ctx.restore();
  });

  ctx.restore();
}


/* گلبرگ */
function petal(cx,cy,rx,ry,angle,alpha){

  ctx.save();

  ctx.translate(cx,cy);
  ctx.rotate(angle);

  const gradient=ctx.createRadialGradient(
    0,-ry*.2,
    2,
    0,0,
    ry
  );

  gradient.addColorStop(
    0,
    `rgba(255,245,249,${alpha})`
  );

  gradient.addColorStop(
    .45,
    `rgba(255,151,194,${alpha})`
  );

  gradient.addColorStop(
    1,
    `rgba(199,50,111,${alpha})`
  );

  ctx.fillStyle=gradient;

  ctx.beginPath();
  ctx.ellipse(
    0,0,
    rx,ry,
    0,0,Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* ساخت گل */
function blossom(cx,cy,size){

  const petals=10;

  for(let i=0;i<petals;i++){

    const angle=i*Math.PI*2/petals;

    petal(
      cx+Math.cos(angle)*size*.22,
      cy+Math.sin(angle)*size*.22,
      size*.32,
      size*.62,
      angle+Math.PI/2,
      .92
    );
  }


  for(let i=0;i<6;i++){

    const angle=i*Math.PI*2/6+.2;

    petal(
      cx+Math.cos(angle)*size*.12,
      cy+Math.sin(angle)*size*.12,
      size*.25,
      size*.45,
      angle+Math.PI/2,
      .98
    );
  }


  /* مرکز گل */

  const center=ctx.createRadialGradient(
    cx,cy,1,
    cx,cy,size*.18
  );

  center.addColorStop(0,"#ffd66d");
  center.addColorStop(1,"#d76b39");

  ctx.fillStyle=center;

  ctx.beginPath();
  ctx.arc(cx,cy,size*.15,0,Math.PI*2);
  ctx.fill();


  /* پرچم‌های گل */

  for(let i=0;i<18;i++){

    const angle=i*Math.PI*2/18;
    const r=size*.18;

    ctx.fillStyle="#ffe89a";

    ctx.beginPath();

    ctx.arc(
      cx+Math.cos(angle)*r,
      cy+Math.sin(angle)*r,
      2.2,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* انیمیشن */

function animate(){

  t+=.016;

  ctx.clearRect(0,0,W,H);


  /* نور پشت گل */

  const glow=ctx.createRadialGradient(
    W/2,H*.38,10,
    W/2,H*.38,H*.65
  );

  glow.addColorStop(
    0,
    "rgba(255,95,157,.11)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);


  /* قلب‌های متحرک */

  hearts.forEach(h=>{

    h.y-=h.speed;
    h.a+=.008;

    if(h.y<-30){
      h.y=H+30;
      h.x=Math.random()*W;
    }

    heart(
      h.x,
      h.y,
      h.s,
      Math.sin(h.a)*.2
    );
  });


  stem();


  /* گل‌ها */

  const sway=Math.sin(t)*3;

  blossom(W*.5+sway,H*.29,58);
  blossom(W*.39+sway,H*.43,42);
  blossom(W*.62+sway,H*.45,47);
  blossom(W*.48+sway,H*.57,37);


  requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
